<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Pionner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- PANTALLA 1: Selección de Usuarios -->
        <div id="roleSelection" class="screen active">
            <div class="header">
                <h1>Pionner</h1>
                <p class="subtitle">Selecciona tu usuario para ingresar</p>
            </div>
            <div class="roles-grid">
                <button class="btn-role" onclick="selectUser('mariadelcarmen', 'María del Carmen')">María del Carmen</button>
                <button class="btn-role" onclick="selectUser('marikarla', 'Marikarla')">Marikarla</button>
                <button class="btn-role" onclick="selectUser('yoandri', 'Yoandri')">Yoandri</button>
            </div>
        </div>

        <!-- PANTALLA 2: Ingreso de PIN -->
        <div id="authSection" class="screen">
            <div class="header">
                <h2 id="userNameDisplay">Usuario</h2>
                <p class="subtitle">Ingresa tu PIN de seguridad</p>
            </div>
            
            <div class="form-group">
                <input type="password" id="userPin" placeholder="****" maxlength="4" inputmode="numeric">
            </div>
            
            <!-- Aquí solo aparecerán los mensajes de ERROR -->
            <div id="feedbackMessage" class="feedback-message"></div>

            <div class="auth-actions">
                <button class="btn-secondary" onclick="goBack()">Cancelar</button>
                <button class="btn-primary" onclick="verifyPin()">Entrar</button>
            </div>
        </div>

                <!-- PANTALLA 3: El interior de la aplicación (Menú Principal) -->
        <div id="mainApp" class="screen">
            <div class="header" style="position: relative;">
                <!-- Campanita de Notificaciones -->
                <div class="bell-container" onclick="verNotificaciones()">
                    🔔 <span id="contadorCampanita" class="badge">0</span>
                </div>
                <h2>Pionner</h2>
                <p class="subtitle" id="welcomeUserText">Cargando...</p>
            </div>
            
            <div class="dashboard-menu">
                <!-- Botón Exclusivo de Yoandri (Verde) -->
                <button id="btnIniciarCuadre" class="btn-primary" style="display: none;" onclick="iniciarCuadre()">
                    Iniciar Cuadre de Turno
                </button>

                <!-- Botones Generales para Todos -->
                <button class="btn-menu" onclick="verHistorial()">
                    📁 Historial de Cuadres
                </button>
                
                <button class="btn-menu" onclick="verAlmacen()">
                    📦 Control de Almacén
                </button>
                
                <!-- Botón Exclusivo de Ustedes (Administradoras) -->
                <button id="btnAjustesMenu" class="btn-menu" style="display: none;" onclick="gestionarMenu()">
                    ⚙️ Ajustes de Inventario
                </button>
            </div>

            <div class="auth-actions" style="margin-top: 40px;">
                <button class="btn-secondary" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
        <!-- PANTALLA 4: Cuadre de Turno (La Tabla Interactiva) -->
        <div id="cuadreSection" class="screen">
            <div class="header">
                <h2>Cuadre de Turno</h2>
                <p class="subtitle" id="turnoSubtittle">Calculando turno...</p>
            </div>
            
            <!-- Contenedor donde cargaremos la lista de productos dinámicamente desde Firebase -->
            <div id="listaProductosContainer" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px; text-align: left;">
                <p style="text-align: center; color: var(--text-gray);">Cargando productos de la base de datos...</p>
            </div>

            <!-- Resumen de Totales y Gastos -->
            <div class="cuadre-resumen" style="text-align: left; background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <p><strong>Total Venta Esperada:</strong> <span id="totalVentaCalculado">0</span> CUP</p>
                <div style="margin-top: 10px;">
                    <label style="font-size: 14px; font-weight: bold;">Gastos del Turno (CUP):</label>
                    <input type="number" id="gastosTurno" placeholder="0" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
            </div>

            <div class="auth-actions">
                <button class="btn-secondary" onclick="cancelarCuadre()">Cancelar</button>
                <button class="btn-primary" onclick="guardarCuadreFinal()">Guardar Cuadre</button>
            </div>
        </div>

        
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
