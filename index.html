<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Pionner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- PANTALLA 1: Selección de Usuarios -->
        <div id="roleSelection" class="screen active">
            <div class="header">
                <h1>Pionner</h1>
                <p class="subtitle">Selecciona tu usuario para ingresar</p>
            </div>
            <div class="roles-grid">
                <button class="btn-role" onclick="selectUser('mariadelcarmen', 'María del Carmen')">María del Carmen</button>
                <button class="btn-role" onclick="selectUser('marikarla', 'Marikarla')">Marikarla</button>
                <button class="btn-role" onclick="selectUser('yoandri', 'Yoandri')">Yoandri</button>
            </div>
        </div>

        <!-- PANTALLA 2: Ingreso de PIN -->
        <div id="authSection" class="screen">
            <div class="header">
                <h2 id="userNameDisplay">Usuario</h2>
                <p class="subtitle">Ingresa tu PIN de seguridad</p>
            </div>
            
            <div class="form-group">
                <input type="password" id="userPin" placeholder="****" maxlength="4" inputmode="numeric">
            </div>
            
            <div id="feedbackMessage" class="feedback-message"></div>

            <div class="auth-actions">
                <button class="btn-secondary" onclick="goBack()">Cancelar</button>
                <button class="btn-primary" onclick="verifyPin()">Entrar</button>
            </div>
        </div>

        <!-- PANTALLA 3: Menú Principal -->
        <div id="mainApp" class="screen">
            <div class="header" style="position: relative;">
                <div class="bell-container" onclick="verNotificaciones()">
                    🔔 <span id="contadorCampanita" class="badge">0</span>
                </div>
                <h2>Pionner</h2>
                <p class="subtitle" id="welcomeUserText">Cargando...</p>
            </div>
            
            <div class="dashboard-menu">
                <button id="btnIniciarCuadre" class="btn-primary" style="display: none;" onclick="iniciarCuadre()">
                    Iniciar Cuadre de Turno
                </button>

                <button class="btn-menu" onclick="verHistorial()">
                    📁 Historial de Cuadres
                </button>
                
                <button class="btn-menu" onclick="verAlmacen()">
                    📦 Control de Almacén
                </button>
                
                <button id="btnAjustesMenu" class="btn-menu" style="display: none;" onclick="gestionarMenu()">
                    ⚙️ Ajustes de Inventario
                </button>
            </div>

            <div class="auth-actions" style="margin-top: 40px;">
                <button class="btn-secondary" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
        
        <!-- PANTALLA 4: Cuadre de Turno -->
        <div id="cuadreSection" class="screen">
            <div class="header">
                <h2>Cuadre de Turno</h2>
                <p class="subtitle">Inventario y Cierre Financiero</p>
            </div>
            
            <!-- Tabla de productos -->
            <div style="width: 100%; overflow-x: auto; margin-bottom: 25px; text-align: left;">
                <div id="listaProductosContainer" style="min-width: 800px;">
                    <p style="text-align: center; color: var(--text-secondary); padding: 20px;">Cargando inventario ordenado...</p>
                </div>
            </div>

            <!-- SECCIÓN DE CIERRE FINANCIERO -->
            <div style="text-align: left; background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1);">
                <h3 style="font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; color: #fff;">Cierre de Caja y Efectivo</h3>
                
                <!-- Venta Total -->
                <div style="margin-bottom: 15px; background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between;">
                    <span style="font-weight: bold; color: #94A3B8;">Venta Total:</span>
                    <strong id="lblVentaTotal" style="color: #10B981; font-size: 16px;">0 CUP</strong>
                </div>

                <!-- Efectivo -->
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; color: #94A3B8;">Efectivo:</label>
                    <input type="number" id="efectivoCaja" placeholder="0" style="width: 100%; padding: 10px; background: rgba(15, 23, 42, 0.8); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;" oninput="calcularCierreFinanciero()">
                </div>

                <!-- Transferencias -->
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; color: #94A3B8;">Transferencias:</label>
                    <div id="transferenciasContainer"></div>
                    <button type="button" onclick="agregarTransferencia()" style="background: none; border: none; color: #10B981; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 6px;">+ Añadir Transferencia</button>
                </div>

                <!-- Gastos -->
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; color: #94A3B8;">Gastos:</label>
                    <div id="gastosContainer"></div>
                    <button type="button" onclick="agregarGasto()" style="background: none; border: none; color: #10B981; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 6px;">+ Añadir Gasto</button>
                </div>

                <!-- Salarios -->
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; color: #94A3B8;">Salarios:</label>
                    <div id="salariosContainer"></div>
                    <button type="button" onclick="agregarSalario()" style="background: none; border: none; color: #10B981; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 6px;">+ Añadir Persona</button>
                </div>

                <!-- Resumen Final -->
                <div style="background: rgba(15, 23, 42, 0.8); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #cbd5e1;">
                        <span>Final:</span>
                        <strong id="lblFinal" style="color: #F8FAFC;">0 CUP</strong>
                    </div>
                    <div style="border-top: 1px dashed rgba(255,255,255,0.1); margin-top: 10px; padding-top: 12px;" id="lblResultadoDiferencia">
                        <span style="color: #94A3B8;">Realiza el conteo para ver la comparativa...</span>
                    </div>
                </div>
            </div>

            <div class="auth-actions" style="margin-bottom: 30px;">
                <button class="btn-secondary" onclick="cancelarCuadre()">Volver</button>
                <button class="btn-primary" onclick="guardarCuadreFinal()">Guardar Cuadre</button>
            </div>
        </div>
        
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
